services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant_owner
      POSTGRES_PASSWORD: owner
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_owner -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/restaurant
      SPRING_DATASOURCE_USERNAME: restaurant_app
      SPRING_DATASOURCE_PASSWORD: app_secret
      APP_FLYWAY_USER: restaurant_owner
      APP_FLYWAY_PASSWORD: owner
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: local-dev-secret-must-be-at-least-32b
      APP_PUBLIC_BASE: http://localhost:8501
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s
  ui:
    build: ./streamlit_app
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8501:8501"

volumes:
  pgdata:
