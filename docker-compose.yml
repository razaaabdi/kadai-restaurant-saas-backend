services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
  api:
    build: .
    depends_on:
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ep-curly-poetry-ayjrm7e1.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&connectTimeout=10&socketTimeout=60&tcpKeepAlive=true
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv6Addresses=false
      SPRING_DATASOURCE_USERNAME: restaurant_app
      SPRING_DATASOURCE_PASSWORD: "App_Secret_9x!Npg"
      APP_FLYWAY_USER: neondb_owner
      APP_FLYWAY_PASSWORD: npg_m6ctghwTFa4K
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: local-dev-secret-must-be-at-least-32b
      APP_PUBLIC_BASE: http://localhost:8501
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s
  ui:
    build: ./streamlit_app
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8501:8501"
